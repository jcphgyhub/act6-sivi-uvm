
name: Publicar SIVI en GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Compilar SIVI
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar TypeScript
        run: npm run check

      - name: Ejecutar pruebas
        run: npm run test:logic

      - name: Compilar para GitHub Pages
        env:
          NEXT_PUBLIC_BASE_PATH: /act6-sivi-uvm
        run: npm run build

      - name: Crear archivo .nojekyll
        run: touch out/.nojekyll

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar artefacto web
        uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    name: Publicar aplicación
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Desplegar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
